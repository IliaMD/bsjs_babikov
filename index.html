<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Components — Module 1</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      padding: 2rem;
    }

    h1, h2 {
      margin: 0 0 1rem;
      font-weight: 600;
    }

    h1 {
      font-size: 1.5rem;
    }

    h2 {
      margin-top: 2.5rem;
      font-size: 1.25rem;
    }

    #app,
    #workers {
      max-width: 520px;
    }

    my-panel {
      --panel-border-radius: 8px;
    }

    my-select {
      --select-width: 100%;
      --select-accent-color: #3b82f6;
      --select-popup-background: #ffffff;
    }

    .light-find-box {
      width: 100%;
      padding: 0.65rem 0.75rem;
      border: 0;
      border-bottom: 1px solid #e2e8f0;
      background: transparent;
      font: inherit;
    }

    .light-find-box:focus {
      outline: none;
    }

    #start {
      padding: 0.55rem 1rem;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #ffffff;
      font: inherit;
      cursor: pointer;
    }

    #start:hover {
      border-color: #94a3b8;
    }

    #start:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .spinner-wrap {
      margin-top: 1rem;
    }

    @keyframes spinner {
      0% {
        transform: scale(0.1) rotate(0deg);
        fill: currentColor;
      }

      33% {
        transform: scale(1) rotate(150deg);
        fill: transparent;
      }

      66% {
        transform: scale(1) rotate(210deg);
        fill: transparent;
      }

      100% {
        transform: scale(0.1) rotate(360deg);
        fill: currentColor;
      }
    }

    .spinner {
      animation: spinner 1.5s infinite linear;
      color: rgb(6, 75, 67);
    }

    #result {
      margin-top: 1rem;
      min-height: 1.5rem;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <h1>Module 1 — Web Components</h1>
  <div id="app"></div>

  <h2>Module 2 — Web Workers</h2>
  <div id="workers">
    <button id="start" type="button">Старт</button>
    <div class="spinner-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" width="64" height="56" fill="none" class="spinner">
        <path stroke="currentColor" stroke-width="4" d="M3.464 30a4 4 0 0 1 0-4L16 4.287a4 4 0 0 1 3.464-2h25.072a4 4 0 0 1 3.464 2L60.536 26a4 4 0 0 1 0 4L48 51.713a4 4 0 0 1-3.464 2H19.464a4 4 0 0 1-3.464-2L3.464 30Z"/>
      </svg>
    </div>
    <div id="result"></div>
  </div>

  <script>
    const onError = (err) => {
      console.error('Failed to load component:', err);
    };

    const components = ['my-panel', 'my-select'];
    let loadedCount = 0;

    const mountApp = () => {
      const panel = document.createElement('my-panel');
      panel.setAttribute('header', 'MultiSelect');
      panel.setAttribute('sub-header', 'Choose one or more options');
      panel.setAttribute('toggleable', '');

      const select = document.createElement('my-select');
      select.innerHTML = `
        <div slot="search">
          <input class="light-find-box" placeholder="Поиск..." />
        </div>
        <option value="opt1">Option 1</option>
        <option value="opt2">Option 2</option>
        <option value="opt3">Option 3</option>
        <option value="opt4">Angular</option>
        <option value="opt5">React</option>
        <option value="opt6">Vue</option>
      `;

      panel.append(select);
      document.getElementById('app').append(panel);
    };

    const onLoad = () => {
      loadedCount += 1;

      if (loadedCount === components.length) {
        mountApp();
      }
    };

    components.forEach((component) => {
      const script = document.createElement('script');
      script.src = `./${component}.js`;
      script.dataset.name = component;
      script.addEventListener('load', onLoad);
      script.addEventListener('error', onError);
      document.body.append(script);
    });

    let thread = null;
    const startButton = document.getElementById('start');
    const resultNode = document.getElementById('result');

    startButton.addEventListener('click', () => {
      if (!window.Worker) {
        resultNode.textContent = 'Web Workers are not supported in this browser.';
        return;
      }

      if (!thread) {
        thread = new Worker('./thread.js');

        thread.addEventListener('message', (evt) => {
          resultNode.textContent = String(evt.data);
          startButton.disabled = false;
        });

        thread.addEventListener('error', () => {
          resultNode.textContent = 'Worker error';
          startButton.disabled = false;
        });
      }

      startButton.disabled = true;
      resultNode.textContent = 'Calculating...';
      thread.postMessage({ timeout: 5000 });
    });
  </script>
</body>
</html>
